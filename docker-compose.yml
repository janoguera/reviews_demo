services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: deposits
      POSTGRES_USER: deposits
      POSTGRES_PASSWORD: deposits
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deposits -d deposits"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/deposits
      SPRING_DATASOURCE_USERNAME: deposits
      SPRING_DATASOURCE_PASSWORD: deposits
    depends_on:
      db:
        condition: service_healthy
