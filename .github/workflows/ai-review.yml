name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai_review:
    name: Run AI Reviewer
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Simulate AI API Call & Post Comments
        uses: actions/github-script@v7
        with:
          script: |
            // 1. MOCK THE AI RESPONSE
            // In a real pipeline, replace this with a fetch() call to the Anthropic API,
            // passing the PR diff as the prompt and parsing the structured response.
            const mockAiComments = [
              {
                file: "src/main/java/com/example/deposits/service/TransactionImportService.java",
                severity: "🔴 CRITICAL",
                message: "The `reference` field added to `TransactionLine` is accepted by the API but silently dropped — it is never mapped to the `Transaction` domain object or written to the database. Any reference data sent by clients will be permanently lost. Either persist it (add the column to the schema and pass it through) or reject it at the API boundary."
              },
              {
                file: "src/main/java/com/example/deposits/service/TransactionImportService.java",
                severity: "🟡 WARNING",
                message: "`importBatch` now inserts each transaction individually inside a loop with no `@Transactional` boundary. If the loop fails halfway through, the batch is partially persisted with no rollback. Annotate the method with `@Transactional` so the entire batch either commits or rolls back atomically."
              },
              {
                file: "src/main/java/com/example/deposits/api/dto/PostInterestRequest.java",
                severity: "🟡 WARNING",
                message: "`PostInterestRequest` has no bean-validation constraints on `amount` or `effectiveDate`. The null/positive check currently lives inside `InterestService`, bypassing Spring's standard validation layer. Add `@NotNull @Positive` to `amount` and enable `@Validated` on the controller so invalid requests are rejected before they reach the service."
              },
              {
                file: "src/main/resources/db/migration/V2__interest_posting.sql",
                severity: "🔵 INFO",
                message: "No index is defined on `interest_posting.account_id`, yet `findByAccountId` always filters on that column. As the table grows this will become a full scan. Add `CREATE INDEX idx_interest_posting_account_id ON interest_posting(account_id)` to the migration."
              }
            ];

            // 2. FORMAT THE COMMENTS INTO MARKDOWN
            let commentBody = "### 🤖 AI Code Review Feedback\n\n";
            commentBody += "I analyzed your pull request changes and found the following items:\n\n";

            mockAiComments.forEach((comment, index) => {
              commentBody += `#### Finding #${index + 1}: ${comment.severity}\n`;
              commentBody += `- **File:** \`${comment.file}\`\n`;
              commentBody += `- **Issue:** ${comment.message}\n\n`;
            });

            commentBody += "---\n*Note: This is a simulated review. In production, findings are generated by calling the Anthropic API with the PR diff as context.*";

            // 3. POST THE COMMENT TO THE PULL REQUEST
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

            // 4. FAIL IF CRITICAL ISSUES EXIST
            const hasCritical = mockAiComments.some(comment => comment.severity.includes("CRITICAL"));
            if (hasCritical) {
              core.setFailed("AI Code Review found CRITICAL issues. Please fix them before merging.");
            }
